<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2" />
    </linearGradient>

    <!-- Scoreboard Frame Gradient -->
    <linearGradient id="boardFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Basketball Gradients -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff8c38" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <radialGradient id="ballHighlight" cx="32%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffedd5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff8c38" stop-opacity="0" />
    </radialGradient>

    <!-- LED Glow Filter -->
    <filter id="ledGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.9" />

  <!-- Stadium Scoreboard Grid Mesh (Subtle Background) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="200" x2="432" y2="200" />
    <line x1="80" y1="240" x2="432" y2="240" />
    <line x1="120" y1="60" x2="120" y2="260" />
    <line x1="180" y1="60" x2="180" y2="260" />
    <line x1="240" y1="60" x2="240" y2="260" />
    <line x1="300" y1="60" x2="300" y2="260" />
    <line x1="360" y1="60" x2="360" y2="260" />
  </g>

  <!-- ==================== DIGITAL SCOREBOARD UNIT ==================== -->
  <g id="scoreboard">
    <!-- Scoreboard Chassis Outer Shadow & Body -->
    <rect x="56" y="56" width="400" height="230" rx="24" fill="#050811" stroke="#334155" stroke-width="3" />
    <rect x="64" y="64" width="384" height="214" rx="18" fill="url(#boardFrame)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Top Header Bar on Scoreboard -->
    <rect x="74" y="74" width="364" height="28" rx="8" fill="#090d16" />
    
    <!-- Header Labels -->
    <text x="135" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">HOME</text>
    <text x="256" y="93" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">PERIOD 4</text>
    <text x="377" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">GUEST</text>

    <!-- LED Score Display Screen Left (HOME: 98 in Gold/Amber) -->
    <rect x="80" y="110" width="110" height="96" rx="12" fill="#000000" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Segment background ghost digits -->
    <text x="135" y="184" fill="#f59e0b" fill-opacity="0.08" font-family="'Courier New', Courier, monospace" font-size="82" font-weight="900" text-anchor="middle">88</text>
    <!-- Glowing active digits -->
    <text x="135" y="184" fill="#fbbf24" font-family="'Courier New', Courier, monospace" font-size="82" font-weight="900" text-anchor="middle" filter="url(#ledGlow)">98</text>

    <!-- Center Match Clock / 24s Shot Clock -->
    <rect x="206" y="110" width="100" height="96" rx="12" fill="#000000" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="256" y="138" fill="#ef4444" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="900" text-anchor="middle" filter="url(#ledGlow)">01:24</text>
    <line x1="216" y1="148" x2="296" y2="148" stroke="#334155" stroke-width="1" />
    <!-- 24s Shot Clock Display -->
    <text x="256" y="194" fill="#f43f5e" font-family="'Courier New', Courier, monospace" font-size="40" font-weight="900" text-anchor="middle" filter="url(#ledGlow)">24</text>

    <!-- LED Score Display Right (GUEST: 95 in Cyan/Neon) -->
    <rect x="322" y="110" width="110" height="96" rx="12" fill="#000000" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Segment background ghost digits -->
    <text x="377" y="184" fill="#06b6d4" fill-opacity="0.08" font-family="'Courier New', Courier, monospace" font-size="82" font-weight="900" text-anchor="middle">88</text>
    <!-- Glowing active digits -->
    <text x="377" y="184" fill="#22d3ee" font-family="'Courier New', Courier, monospace" font-size="82" font-weight="900" text-anchor="middle" filter="url(#ledGlow)">95</text>

    <!-- Bottom Status Dots on Scoreboard -->
    <g transform="translate(90, 224)">
      <circle cx="15" cy="8" r="4.5" fill="#f59e0b" filter="url(#ledGlow)" />
      <circle cx="32" cy="8" r="4.5" fill="#f59e0b" filter="url(#ledGlow)" />
      <circle cx="49" cy="8" r="4.5" fill="#f59e0b" filter="url(#ledGlow)" />
      <circle cx="66" cy="8" r="4.5" fill="#f59e0b" filter="url(#ledGlow)" />
      <circle cx="83" cy="8" r="4.5" fill="#1e293b" />
    </g>

    <g transform="translate(332, 224)">
      <circle cx="15" cy="8" r="4.5" fill="#06b6d4" filter="url(#ledGlow)" />
      <circle cx="32" cy="8" r="4.5" fill="#06b6d4" filter="url(#ledGlow)" />
      <circle cx="49" cy="8" r="4.5" fill="#06b6d4" filter="url(#ledGlow)" />
      <circle cx="66" cy="8" r="4.5" fill="#1e293b" />
      <circle cx="83" cy="8" r="4.5" fill="#1e293b" />
    </g>

    <!-- Center Possession Arrow Indicators -->
    <polygon points="244,232 232,238 244,244" fill="#f59e0b" filter="url(#ledGlow)" />
    <polygon points="268,232 280,238 268,244" fill="#334155" />
  </g>

  <!-- ==================== 3D VIBRANT BASKETBALL ==================== -->
  <g id="basketball" filter="url(#ballShadow)">
    <ellipse cx="256" cy="355" rx="165" ry="155" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="16 12" opacity="0.4" />
    <ellipse cx="256" cy="355" rx="178" ry="168" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 20" opacity="0.3" />

    <!-- Ball Base Sphere -->
    <circle cx="256" cy="355" r="126" fill="url(#ballShade)" stroke="#270a04" stroke-width="3.5" />

    <!-- Ball Ribbing Lines -->
    <path d="M 256,229 C 250,290 250,420 256,481" fill="none" stroke="#1c0a00" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 130,355 C 190,361 322,361 382,355" fill="none" stroke="#1c0a00" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 166,265 C 235,305 235,405 166,445" fill="none" stroke="#1c0a00" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 346,265 C 277,305 277,405 346,445" fill="none" stroke="#1c0a00" stroke-width="6.5" stroke-linecap="round" />

    <!-- Inner Seam Depth Shadow -->
    <path d="M 256,229 C 250,290 250,420 256,481" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.8" />
    <path d="M 130,355 C 190,361 322,361 382,355" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.8" />
    <path d="M 166,265 C 235,305 235,405 166,445" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.8" />
    <path d="M 346,265 C 277,305 277,405 346,445" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.8" />

    <!-- Top Glossy Specular Lighting -->
    <circle cx="256" cy="355" r="126" fill="url(#ballHighlight)" pointer-events="none" />
    <circle cx="256" cy="355" r="124" fill="none" stroke="#fed7aa" stroke-width="2.5" opacity="0.4" />
  </g>

  <!-- Sparkle Glint -->
  <g transform="translate(225, 275) scale(0.65)" opacity="0.9">
    <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15 Z" fill="#ffffff" filter="url(#ledGlow)" />
  </g>
</svg>
