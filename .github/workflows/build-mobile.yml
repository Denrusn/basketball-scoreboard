name: Build Mobile Apps (Android APK & iOS App)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "mobile-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Android APK 自动打包任务
  # ==========================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔨 Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 2. iOS App 自动编译打包任务 (macOS Runner)
  # ==========================================
  build-ios:
    name: 🍎 Build iOS App
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Build iOS Project (Simulator / Unsigned App)
        working-directory: ios/App
        run: |
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Compress iOS App
        run: |
          mkdir -p ios/App/build/Release-iphoneos
          find ios/App -name "*.app" -type d -exec zip -r ios/BasketballScoreboard-iOS.zip {} + || true
          if [ ! -f ios/BasketballScoreboard-iOS.zip ]; then
            cd ios/App
            zip -r ../BasketballScoreboard-iOS.zip .
          fi

      - name: 🚀 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-iOS-App
          path: ios/BasketballScoreboard-iOS.zip
          retention-days: 14
