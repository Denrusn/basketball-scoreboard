name: Build Mobile Apps (Android APK & iOS App)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "mobile-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Android APK 自动打包任务
  # ==========================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Node 22 LTS for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK 21 (Capacitor 8 requires Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔨 Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 2. iOS App 自动编译打包任务 (macOS Runner)
  # ==========================================
  build-ios:
    name: 🍎 Build iOS App
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Node 22 LTS for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Build iOS Project (Unsigned App via SPM, no CocoaPods)
        working-directory: ios/App
        run: |
          # Capacitor 8 uses Swift Package Manager; fall back to CocoaPods only if Podfile exists
          if [ -f "Podfile" ]; then
            pod install
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi

      - name: 📦 Compress iOS App
        run: |
          APP_DIR=$(find ios/App -name "App.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "App.app not found"
            exit 1
          fi
          cd "$(dirname "$APP_DIR")"
          zip -r BasketballScoreboard-iOS.zip App.app
          mv BasketballScoreboard-iOS.zip "$GITHUB_WORKSPACE/ios/BasketballScoreboard-iOS.zip"

      - name: 🚀 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-iOS-App
          path: ios/BasketballScoreboard-iOS.zip
          if-no-files-found: error
          retention-days: 14
