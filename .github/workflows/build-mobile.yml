name: Build Mobile Apps (Android APK & iOS App)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: "mobile-build-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android APK 自动打包任务
  # ==========================================
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Node 22 LTS for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK 21 (Capacitor 8 requires Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔨 Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 Prepare APK for Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Basketball-Scoreboard-Android.apk

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-Android-Debug-APK
          path: output/Basketball-Scoreboard-Android.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 2. iOS App 自动编译打包任务 (macOS Runner)
  # ==========================================
  build-ios:
    name: 🍎 Build iOS App
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (Node 22 LTS for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Init & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Build iOS Project (Unsigned App via SPM, no CocoaPods)
        working-directory: ios/App
        run: |
          # Capacitor 8 uses Swift Package Manager; fall back to CocoaPods only if Podfile exists
          if [ -f "Podfile" ]; then
            pod install
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi

      - name: 📦 Compress iOS App
        run: |
          APP_DIR=$(find ios/App -name "App.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "App.app not found"
            exit 1
          fi
          cd "$(dirname "$APP_DIR")"
          zip -r Basketball-Scoreboard-iOS.zip App.app
          mkdir -p "$GITHUB_WORKSPACE/output"
          mv Basketball-Scoreboard-iOS.zip "$GITHUB_WORKSPACE/output/Basketball-Scoreboard-iOS.zip"

      - name: 🚀 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasketballScoreboard-iOS-App
          path: output/Basketball-Scoreboard-iOS.zip
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 3. 自动发布到 GitHub Releases
  # ==========================================
  publish-release:
    name: 📦 Publish to GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: BasketballScoreboard-Android-Debug-APK
          path: release-files

      - name: 📥 Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: BasketballScoreboard-iOS-App
          path: release-files

      - name: 🏷️ Determine Release Tag & Name
        id: release_info
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="🏀 篮球记分牌 Pro ${TAG_NAME}"
          else
            TAG_NAME="v${VERSION}"
            RELEASE_NAME="🏀 篮球记分牌 Pro v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: 🚀 Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/Basketball-Scoreboard-Android.apk
            release-files/Basketball-Scoreboard-iOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
